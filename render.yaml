services:
  - type: web
    name: carealign-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG_LOG_RAW
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: PROVIDER_FAILURE_THRESHOLD
        value: "3"
      - key: PROVIDER_RECOVERY_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false
